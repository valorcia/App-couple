<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Entre Nous — icône « papier & encre » : deux cercles qui se rejoignent, le commun surligné au marqueur. -->
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feComponentTransfer in="g" result="a"><feFuncA type="linear" slope="0.09"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="a" mode="multiply"/>
    </filter>
    <clipPath id="lens"><circle cx="432" cy="528" r="292"/></clipPath>
  </defs>
  <!-- Papier -->
  <rect width="1024" height="1024" fill="#F3E7D3"/>
  <g filter="url(#grain)"><rect width="1024" height="1024" fill="#F3E7D3"/></g>
  <!-- Ombre portée dure (encre), signature de la direction -->
  <g transform="translate(26 26)" fill="#271922">
    <circle cx="432" cy="528" r="292"/>
    <circle cx="592" cy="528" r="292"/>
  </g>
  <!-- Les deux cercles -->
  <circle cx="432" cy="528" r="292" fill="#E0582B"/>
  <circle cx="592" cy="528" r="292" fill="#4B2A46"/>
  <!-- Le commun, au marqueur -->
  <g clip-path="url(#lens)"><circle cx="592" cy="528" r="292" fill="#F2BF45"/></g>
  <!-- Contours encre -->
  <circle cx="432" cy="528" r="292" fill="none" stroke="#271922" stroke-width="18"/>
  <circle cx="592" cy="528" r="292" fill="none" stroke="#271922" stroke-width="18"/>
  <!-- Reflet papier sur l'orange, trait de marqueur -->
  <path d="M322 376c36-60 96-100 164-112" fill="none" stroke="#F3E7D3" stroke-width="16" stroke-linecap="round" opacity="0.85"/>
  <!-- Étincelle encre, tracée à la main -->
  <g fill="none" stroke="#271922" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <path d="M846 172l22 52 52 22-52 22-22 52-22-52-52-22 52-22z"/>
    <path d="M152 836l12 28 28 12-28 12-12 28-12-28-28-12 28-12z" stroke-width="12"/>
  </g>
</svg>
